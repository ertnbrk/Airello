replicaCount: 3

image:
  repository: 123456789.dkr.ecr.eu-central-1.amazonaws.com/planmate-api
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.planmate.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: planmate-api-tls
      hosts:
        - api.planmate.ai

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5

env:
  - name: SPRING_PROFILE
    value: "prod"
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: planmate-secrets
        key: db-url
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: planmate-secrets
        key: db-user
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: planmate-secrets
        key: db-pass
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: planmate-secrets
        key: redis-url
  - name: RABBIT_HOST
    valueFrom:
      secretKeyRef:
        name: planmate-secrets
        key: rabbit-host
  - name: S3_BUCKET
    value: "planmate-artifacts-prod"
  - name: KEYCLOAK_ISSUER
    value: "https://auth.planmate.ai/realms/planmate"
  - name: STRIPE_SECRET
    valueFrom:
      secretKeyRef:
        name: planmate-secrets
        key: stripe-secret
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"
