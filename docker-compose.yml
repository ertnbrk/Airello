version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: planmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planmate}
      POSTGRES_USER: ${POSTGRES_USER:-planmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planmate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - planmate-network

  redis:
    image: redis/redis-stack:latest
    container_name: planmate-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${REDIS_INSIGHT_PORT:-8001}:8001"
    volumes:
      - redis_data:/data
    environment:
      REDIS_ARGS: "--save 60 1000 --appendonly yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - planmate-network

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: planmate-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILE: ${SPRING_PROFILE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/planmate
      DB_USER: ${POSTGRES_USER:-planmate}
      DB_PASS: ${POSTGRES_PASSWORD:-secret}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-xtozE6ozyuhgkcJC7boSTI65p2Kwv4aUWRU1oYR2c4k=}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-2592000000}
      ENABLE_AUTH: ${ENABLE_AUTH:-true}
      AI_ENABLED: ${AI_ENABLED:-true}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SESSION_STORE_TYPE: redis
      SPRING_SESSION_REDIS_NAMESPACE: "airello:session"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_QUEUE_KEY: ${AI_QUEUE_KEY:-ai:jobs}
      AI_WORKER_TOKEN: ${WORKER_TOKEN:-changeme-worker-secret-token}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - planmate-network

  ai-worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    container_name: planmate-ai-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      AI_QUEUE_KEY: ${AI_QUEUE_KEY:-ai:jobs}
      JAVA_CALLBACK_URL: http://api:8080/v1/ai/callback
      WORKER_TOKEN: ${WORKER_TOKEN:-changeme-worker-secret-token}
      LLM_TYPE: ${LLM_TYPE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WORKER_POLL_TIMEOUT: ${WORKER_POLL_TIMEOUT:-10}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - planmate-network

networks:
  planmate-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
