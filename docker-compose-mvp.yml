version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: planmate-postgres-mvp
    environment:
      POSTGRES_DB: planmate
      POSTGRES_USER: planmate
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_mvp:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planmate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_mvp:
    driver: local
