# Development profile - simplified for local testing
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Disable JWT validation in dev mode (use local auth instead)
          issuer-uri: ${KEYCLOAK_ISSUER:}

  # Show SQL in dev mode
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    ai.planmate: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# Enable local auth for dev
planmate:
  auth:
    local-enabled: true
