spring:
  application:
    name: planmate-api-test

  # Use H2 in-memory database for tests
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Disable Flyway for tests (using ddl-auto instead)
  flyway:
    enabled: false

  # Disable Redis auto-configuration for tests
  data:
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # Disable RabbitMQ auto-configuration for tests
  rabbitmq:
    listener:
      simple:
        auto-startup: false

# Logging
logging:
  level:
    root: WARN
    ai.planmate: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# Application-specific
planmate:
  features:
    ai-enabled: false
  limits:
    upload-max-size-mb: 10
    ai-requests-per-day-free: 1
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# AWS - use defaults for tests
aws:
  s3:
    bucket: test-bucket
    region: us-east-1
  secretsmanager:
    enabled: false

# Stripe - use test placeholders
stripe:
  api-key: sk_test_placeholder
  webhook-secret: whsec_placeholder
